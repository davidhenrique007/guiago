name: guiago
description: >
  GuiaGo — Organize. Aja. Avance.
  Personal productivity, execution and behavioral intelligence app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Navigation
  go_router: ^17.5.0

  # Models / code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local database
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Identifiers
  uuid: ^4.4.0

  # Time / timezone-aware scheduling (Fase 3)
  timezone: ^0.11.1

  # Notifications & TTS (wired in Fase 3/4, dependency added now per Fase 0 scope)
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.0.2
  permission_handler: ^13.0.1

  # Future network layer (SaaS sync) — dependency reserved, unused in MVP core
  dio: ^5.5.0

  cupertino_icons: ^1.0.8

  # Fase 1 — premium typography for the design system
  google_fonts: ^6.2.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
